# Gradle needs more than the 512 MB default for Compose + KSP + Supabase; 2 GB was too small
# and made first builds extremely slow or fail on low-memory machines.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Faster repeat builds: reuse task outputs and build independent modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
kotlin.incremental=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
