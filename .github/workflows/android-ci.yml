name: Android CI

# Runs the unit tests and builds the debug APK on every push and pull request.
on:
  push:
    branches: [main, dev, supabase-salon-app]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android app folder
    env:
      # Optional. Without them the app still builds (it just shows "not configured" at runtime).
      # The anon key is public by design; never put the service_role key here.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android app folder

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Summarise test results
        if: always()
        run: node "$GITHUB_WORKSPACE/.github/scripts/test-summary.js"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android app folder/app/build/reports/tests/testDebugUnitTest
            android app folder/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android app folder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
