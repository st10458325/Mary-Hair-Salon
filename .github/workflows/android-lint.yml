name: Android Lint

# Static analysis of the Kotlin code and resources with Android Lint (code quality, common bugs).
on:
  push:
    branches: [main, dev, supabase-salon-app]
    paths:
      - 'android app folder/app/**'
      - 'android app folder/*.gradle.kts'
      - 'android app folder/gradle/**'
      - '.github/workflows/android-lint.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'android app folder/app/**'
      - 'android app folder/*.gradle.kts'
      - 'android app folder/gradle/**'
  workflow_dispatch:

concurrency:
  group: android-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android app folder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android app folder

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android app folder/app/build/reports/lint-results-debug.html
            android app folder/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
